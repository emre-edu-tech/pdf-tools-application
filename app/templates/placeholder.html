{% extends "base.html" %}

{% block title %}{{ title }} — PDF Toolkit{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 sm:px-6 lg:px-8 py-16 text-center">
  <div class="inline-flex items-center justify-center w-14 h-14 rounded-xl bg-accent-50 border border-accent-100 text-accent-600 mb-4">
    <svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
  </div>
  <h1 class="text-2xl font-semibold text-ink-900">{{ heading }}</h1>
  <p class="mt-2 text-ink-500">{{ message }}</p>
  <a href="/" class="mt-6 inline-flex items-center justify-center px-5 py-2.5 rounded-lg bg-accent-500 text-white text-sm font-medium hover:bg-accent-600 transition shadow-sm">Back to home</a>
</div>
{% endblock %}
